{{- if .Values.storage.enabled }}
{{- range $name := splitList " " (include "beets-api.volumeNames" .) }}
{{- $volume := index $.Values.storage $name }}
{{- if not $volume.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "beets-api.claimName" (list $ $name) }}
  labels:
    {{- include "beets-api.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- if $.Values.storage.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml $volume.accessModes | nindent 4 }}
  {{- with $volume.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $volume.size }}
{{- end }}
{{- end }}
{{- end }}
