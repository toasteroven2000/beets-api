# beets-api keeps its state in SQLite files and runs one Import at a time in memory,
# so it is always a single replica: there is no replicaCount or autoscaling.

image:
  repository: ghcr.io/toasteroven2000/beets-api
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# How a new pod replaces the old one. The volumes are ReadWriteOnce and the API
# has one writer, so the old pod must stop first. Any Deployment strategy is
# accepted, e.g. `type: RollingUpdate` with a `rollingUpdate:` map.
strategy:
  type: Recreate

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
    - ALL
  runAsUser: 65532
  runAsGroup: 65532

service:
  type: ClusterIP
  port: 8338

# beets' config.yaml. The chart mounts the music library at /music, and beets' directory
# (BEETSDIR, where its database and the API's own state live) from `extraVolumes` and `extraVolumeMounts` below.
# Where config.yaml comes from, in order:
#
#  1. beetsConfig.existing.name: a ConfigMap or Secret you manage, such as one holding API keys.
#  2. beetsConfig.raw: the text below, which the chart keeps in a ConfigMap.
#  3. neither (set raw to ""): beets reads config.yaml from the config volume (`dir`),
#     which you put there yourself. It must set `directory: /music`, because the default
#     (~/Music) is on the read-only root filesystem.
#
# Either way it is mounted at `dir`/config.yaml, so it is read-only to the API.
beetsConfig:
  # BEETSDIR, an absolute path where the config volume is mounted. beets keeps config.yaml,
  # library.db and the API's beets-api.db there.
  dir: /config
  existing:
    name: ""
    kind: ConfigMap   # or Secret
    key: config.yaml
  raw: |
    directory: /music
    plugins: []

# beets-api's own settings, apart from beets' config.yaml above.
beetsApiConfig:
  # Where removed files go instead of being deleted (BEETS_API_TRASH_DIR), mounted from
  # `extraVolumes.trash`. Empty means no Trash, and then nothing that would delete a file is allowed.
  trashDir: /trash
  # Directories that Imports may read from (BEETS_API_IMPORT_PATHS). Mount them with
  # `extraVolumes` and `extraVolumeMounts`. Empty means unset, and then an Import may
  # read any path the container can.
  importPaths: []

# More environment variables for the container, as Kubernetes `env` entries. They come after
# the ones the chart sets (BEETSDIR, BEETS_API_TRASH_DIR, ...), so they can override them.
extraEnvs: []
#  - name: TZ
#    value: Europe/London
#  - name: DISCOGS_TOKEN
#    valueFrom:
#      secretKeyRef: {name: beets-secrets, key: discogs}

# Volumes and where they are mounted, as maps keyed by name so a caller can override one entry
# without repeating the others. `extraVolumes.<name>` is a Kubernetes volume source (`nfs`,
# `persistentVolumeClaim`, `emptyDir`, ...). `extraVolumeMounts.<key>` is a volumeMount whose
# `name` is the volume to mount, and defaults to the key; give two mounts different keys to
# mount one volume at two paths, each with its own `subPath`.
#
# The defaults keep everything in emptyDir volumes, so the library, its database, the audit and
# the Trash are lost whenever the pod is replaced: override them for real use. Set an entry to
# null to remove it (for example `extraVolumeMounts.trash: null` together with `trashDir: ""`).
# The mounts must include `beetsConfig.dir`, `/music`, and `beetsApiConfig.trashDir` when set.
extraVolumes:
  config: {emptyDir: {}}
  music: {emptyDir: {}}
  trash: {emptyDir: {}}
#  incoming:
#    nfs: {server: nas.local, path: /downloads}

extraVolumeMounts:
  config: {mountPath: /config}
  music: {mountPath: /music}
  trash: {mountPath: /trash}
#  incoming:
#    mountPath: /incoming
#    subPath: downloads
#    readOnly: true

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
